name: CI

on:
  push:
    branches: ["**"]

jobs:
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Postgres)
        run: npx prisma generate

      # Money fields (dayPrice, setupCostSnapshot, etc.) are Decimal in
      # prisma/schema.prisma (Postgres) but Float in prisma/schema.dev.prisma
      # (SQLite dev). Type-checking against the Postgres client here — before
      # the SQLite client is generated below for tests — is what catches
      # Decimal-vs-number drift at build time instead of in production
      # (Y1.5). Do not reorder this after the SQLite generate step, and do
      # not skip it: it is the only place CI sees the Postgres-shaped types.
      - name: TypeScript type check (against Postgres client — Decimal drift guard)
        run: npx tsc --noEmit

      - name: Generate Prisma client (SQLite dev, for integration tests)
        run: npx prisma generate --schema=prisma/schema.dev.prisma

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: file:/tmp/ci-test-placeholder.db
          JWT_SECRET: ci-placeholder-secret

      - name: Generate Prisma client (Postgres, for build)
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-placeholder-secret
