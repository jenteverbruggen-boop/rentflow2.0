name: CI

on:
  push:
    branches: ["**"]

jobs:
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Postgres)
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Generate Prisma client (SQLite dev, for integration tests)
        run: npx prisma generate --schema=prisma/schema.dev.prisma

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: file:/tmp/ci-test-placeholder.db
          JWT_SECRET: ci-placeholder-secret

      - name: Generate Prisma client (Postgres, for build)
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-placeholder-secret
